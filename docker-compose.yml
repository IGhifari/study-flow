name: studyflow

services:
  postgres:
    image: postgres:16-alpine
    container_name: studyflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-studyflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studyflow_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-studyflow_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-studyflow_user} -d ${POSTGRES_DB:-studyflow_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: studyflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  pgdata:
    name: studyflow-pgdata
  redisdata:
    name: studyflow-redisdata
