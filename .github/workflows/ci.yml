name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  validate:
    name: Build & Quality Gates
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: studyflow_user
          POSTGRES_PASSWORD: studyflow_dev_password
          POSTGRES_DB: studyflow_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U studyflow_user -d studyflow_dev"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: "postgresql://studyflow_user:studyflow_dev_password@localhost:5432/studyflow_dev?schema=public"
      DATABASE_URL_TEST: "postgresql://studyflow_user:studyflow_dev_password@localhost:5432/studyflow_dev?schema=public"
      REDIS_URL: "redis://localhost:6379"
      JWT_ACCESS_SECRET: "ci_test_jwt_access_secret_super_secure_32_chars"
      INTERNAL_API_URL: "http://localhost:4000"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build shared package
        run: npm run build --workspace=@studyflow/shared

      - name: Build database package
        run: npm run build --workspace=@studyflow/database

      - name: Run Prisma migrations
        run: npx prisma migrate deploy --schema=packages/database/prisma/schema.prisma

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run automated tests
        run: npm run test

      - name: Build monorepo packages and applications
        run: npm run build