  <text x="54" y="247" fill="#4F46E5" font-family="ui-monospace, monospace" font-size="9.5" font-weight="600">1  dist[source] ← 0</text>
  <text x="54" y="263" fill="#18181B" font-family="ui-monospace, monospace" font-size="9.5">2  PQ.insert(source, 0)</text>
  <text x="54" y="279" fill="#52525B" font-family="ui-monospace, monospace" font-size="9.5">3  while PQ is not empty: u ← PQ.extractMin()</text>

