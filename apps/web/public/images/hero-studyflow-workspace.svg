  <text x="52" y="193" fill="#52525B" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5">Setiap simpul u yang diekstrak dari antrean prioritas</text>
  <text x="52" y="207" fill="#52525B" font-family="ui-sans-serif, system-ui, sans-serif" font-size="9.5">min-heap memiliki jarak terpendek d[u] yang final.</text>

